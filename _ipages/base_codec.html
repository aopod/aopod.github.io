				}
				var normalized = cleaned.replace(/\+/g, '-').replace(/\//g, '_') + '='.repeat(padNeeded);
				return decodeBaseX(normalized, this.alpha, this.bitsPerChar, this.pad);
			},
			features: { padding: true }
		},
		base32: {
			label: 'Base32',
			alpha: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',
			pad: '=',
			blockChars: 8,
			bitsPerChar: 5,
			encode: function (bytes, opts) {
				var s = encodeBaseX(bytes, this.alpha, this.bitsPerChar, this.pad, opts.padding !== false, this.blockChars);
				if (opts.case === 'lower') s = s.toLowerCase();
				return s;
			},
			decode: function (str, ctx) {
				// 自动转大写、自动补 padding
				var cleaned = stripWs(str).toUpperCase();
				if (/[a-z]/.test(stripWs(str))) {
					ctx.warnings.push('检测到小写字母，已自动按大写字母表解码');
				}
				var noPad = cleaned.replace(/=+$/, '');
				var mod = noPad.length % 8;
				var padNeeded = mod === 0 ? 0 : 8 - mod;
				if (padNeeded > 0) {
					ctx.warnings.push('输入缺少 <code>' + padNeeded + '</code> 个 padding「=」，已自动补齐');
				}
				return decodeBaseX(noPad + '='.repeat(padNeeded), this.alpha, this.bitsPerChar, this.pad);
			},
			features: { padding: true, case: true }
		},
		base16: {
			label: 'Base16 / Hex',
			alphaUpper: '0123456789ABCDEF',
			alphaLower: '0123456789abcdef',
			encode: function (bytes, opts) {
				var alpha = opts.case === 'lower' ? this.alphaLower : this.alphaUpper;
				var s = '';
				for (var i = 0; i < bytes.length; i++) {
					s += alpha[bytes[i] >> 4] + alpha[bytes[i] & 0xF];
				}
				return s;
			},
			decode: function (str, ctx) {
				var cleaned = stripWs(str).replace(/^0[xX]/, '').toUpperCase();
				if (cleaned.length === 0) return new Uint8Array(0);
				if (/[a-z]/.test(stripWs(str).replace(/^0[xX]/, ''))) {
					ctx.warnings.push('检测到小写字母，已自动按大写字母表解码');
				}
				if (cleaned.length % 2 !== 0) {
					throw new Error('Base16 输入长度必须为偶数（每两个十六进制字符对应一个字节）');
				}
				if (!/^[0-9A-F]*$/.test(cleaned)) {
					var m = cleaned.match(/[^0-9A-F]/);
					throw new Error('包含非法字符「' + (m ? m[0] : '?') + '」（仅允许 0-9、A-F）');
				}
				var out = new Uint8Array(cleaned.length / 2);
				for (var i = 0; i < out.length; i++) {
					out[i] = parseInt(cleaned.substr(i * 2, 2), 16);
				}
				return out;
			},
			features: { case: true }
		},
		base58btc: {
			label: 'Base58 (Bitcoin)',
			alpha: '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz',
			encode: function (bytes) { return bigIntEncode(bytes, this.alpha); },
			decode: function (str) { return bigIntDecode(stripWs(str), this.alpha); },
			features: {}
		},
		base58flickr: {
			label: 'Base58 (Flickr)',
			alpha: '123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ',
			encode: function (bytes) { return bigIntEncode(bytes, this.alpha); },
			decode: function (str) { return bigIntDecode(stripWs(str), this.alpha); },
			features: {}
		},
		base62: {
			label: 'Base62',
			alpha: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
			encode: function (bytes) { return bigIntEncode(bytes, this.alpha); },
			decode: function (str) { return bigIntDecode(stripWs(str), this.alpha); },
			features: {}
		},
		ascii85: {
			label: 'Ascii85',
			encode: function (bytes, opts) {
				if (bytes.length === 0) return opts.ascii85Delim ? '<~~>' : '';
				var out = opts.ascii85Delim ? '<~' : '';
				var i = 0;
				while (i < bytes.length) {
					if (bytes.length - i < 4) {
						// 末尾不足 4 字节，补 0 后正常编码，再截掉多余字符
						var partial = bytes.length - i;
						var b0 = bytes[i], b1 = i + 1 < bytes.length ? bytes[i + 1] : 0;
						var b2 = i + 2 < bytes.length ? bytes[i + 2] : 0;
						var b3 = i + 3 < bytes.length ? bytes[i + 3] : 0;
						var n = b0 * 0x1000000 + b1 * 0x10000 + b2 * 0x100 + b3;
						var chunk = '';
						for (var k = 0; k < 5; k++) {
							chunk = String.fromCharCode(33 + (n % 85)) + chunk;
							n = Math.floor(n / 85);
						}
						out += chunk.slice(0, partial + 1);
						break;
					}
					var full = bytes[i] * 0x1000000 + bytes[i + 1] * 0x10000 + bytes[i + 2] * 0x100 + bytes[i + 3];
					if (full === 0) {
						out += 'z'; // 4 个零字节快捷字符
					} else {
						var c = '';
						var x = full;
						for (var j = 0; j < 5; j++) {
							c = String.fromCharCode(33 + (x % 85)) + c;
							x = Math.floor(x / 85);
						}
						out += c;
					}
					i += 4;
				}
				if (opts.ascii85Delim) out += '~>';
				return out;
			},
			decode: function (str, ctx) {
				var cleaned = stripWs(str);
				if (cleaned.indexOf('<~') === 0) cleaned = cleaned.slice(2);
				if (cleaned.length >= 2 && cleaned.slice(-2) === '~>') cleaned = cleaned.slice(0, -2);
				if (cleaned.length === 0) return new Uint8Array(0);
				var out = [];
				var i = 0;
				while (i < cleaned.length) {
					var ch = cleaned[i];
					if (ch === 'z') {
						if (out.length % 4 !== 0) {
							// 'z' 必须对齐到 4 字节边界（即上一个完整块结束位置）
							// 宽容处理：仅警告
							ctx.warnings.push('「<code>z</code>」快捷字符未对齐到 4 字节边界，仍按 4 个零字节解码');
						}
						out.push(0, 0, 0, 0);
						i++;
						continue;
					}
					var block = cleaned.substr(i, 5);
					var isLast = i + block.length >= cleaned.length;
					var extra = 0;
					var padded = block;
					if (block.length < 5) {
						if (!isLast) throw new Error('Ascii85 块长度异常');
						extra = 5 - block.length;
						padded = block + 'u'.repeat(extra); // 用 'u'(84) 凑齐
					}
					var n = 0;
					for (var k = 0; k < 5; k++) {
						var code = padded.charCodeAt(k);
						if (code < 33 || code > 117) {
							throw new Error('包含非法字符「' + padded[k] + '」（Ascii85 字符范围为 ! – u）');
						}
						n = n * 85 + (code - 33);
					}
					if (n > 0xFFFFFFFF) throw new Error('Ascii85 块值超过 32 位范围');
					out.push((n >>> 24) & 0xFF, (n >>> 16) & 0xFF, (n >>> 8) & 0xFF, n & 0xFF);
					i += 5;
					if (extra > 0) {
						// 末尾块的字节数 = 4 - extra（extra 是补齐的字符数）
						out.length = out.length - extra;
						break;
					}
				}
				return new Uint8Array(out);
			},
			features: { ascii85Delim: true }
		},
		z85: {
			label: 'Z85 (ZeroMQ)',
			alpha: '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-:+=^!/*?&<>()[]{}@%$#',
			encode: function (bytes) {
				if (bytes.length === 0) return '';
				if (bytes.length % 4 !== 0) {
					throw new Error('Z85 编码要求输入字节数是 4 的倍数（当前 ' + bytes.length + ' 字节）');
				}
				var out = '';
				for (var i = 0; i < bytes.length; i += 4) {
					var n = bytes[i] * 0x1000000 + bytes[i + 1] * 0x10000 + bytes[i + 2] * 0x100 + bytes[i + 3];
					var c = '';
					for (var k = 0; k < 5; k++) {
						c = this.alpha[n % 85] + c;
						n = Math.floor(n / 85);
					}
					out += c;
				}
				return out;
			},
			decode: function (str) {
				var cleaned = stripWs(str);
				if (cleaned.length === 0) return new Uint8Array(0);
				if (cleaned.length % 5 !== 0) {
					throw new Error('Z85 解码要求输入字符数是 5 的倍数（当前 ' + cleaned.length + ' 字符）');
				}
				var idx = {};
				for (var i = 0; i < this.alpha.length; i++) idx[this.alpha[i]] = i;
				var out = new Uint8Array(cleaned.length / 5 * 4);
				for (var j = 0, p = 0; j < cleaned.length; j += 5, p += 4) {
					var n = 0;
					for (var k = 0; k < 5; k++) {
						var v = idx[cleaned[j + k]];
						if (v === undefined) {
							throw new Error('包含非法字符「' + cleaned[j + k] + '」（不在 Z85 字符集中）');
						}
						n = n * 85 + v;
					}
					if (n > 0xFFFFFFFF) throw new Error('Z85 块值超过 32 位范围');
					out[p] = (n >>> 24) & 0xFF;
					out[p + 1] = (n >>> 16) & 0xFF;
					out[p + 2] = (n >>> 8) & 0xFF;
					out[p + 3] = n & 0xFF;
				}
				return out;
			},
			features: {}
		}
	};

	// === 状态 ===
	var state = {
		mode: 'encode',
		algo: 'base64',
		options: {
			padding: true,
			case: 'upper',
			ascii85Delim: false
		}
	};

	// === DOM 引用 ===
	var root = $('bcRoot');
	var modeEl = $('bcMode');
	var algoEl = $('bcAlgo');
	var optionsEl = $('bcOptions');
	var inputEl = $('bcInput');
	var outputEl = $('bcOutput');
	var inputCounterEl = $('bcInputCounter');
	var outputCounterEl = $('bcOutputCounter');
	var inputLabelEl = $('bcInputLabel');
	var bannerEl = $('bcBanner');
	var bannerListEl = $('bcBannerList');
	var errorEl = $('bcError');
	var statusEl = $('bcStatus');
	var copyBtn = $('bcCopy');
	var downloadBtn = $('bcDownload');
	var swapBtn = $('bcSwap');
	var sampleBtn = $('bcSample');
	var clearBtn = $('bcClear');

	// === 渲染选项区（根据算法 + 模式动态显示） ===
	function renderOptions() {
		var algo = ALGOS[state.algo];
		var feats = algo.features || {};
		optionsEl.innerHTML = '';

		if (state.mode === 'decode') {
			// 解码时所有变体自动兼容，无可调项
			var hint = document.createElement('span');
			hint.className = 'bc-hint';
			hint.textContent = '解码时自动兼容大小写 / padding / 字符集变体';
			optionsEl.appendChild(hint);
			return;
		}

		if (feats.padding) {
			optionsEl.appendChild(makeCheckbox('bcOptPadding', '补齐 padding「=」', state.options.padding, function (checked) {
				state.options.padding = checked;
				run();
			}));
		}
		if (feats.case) {
			optionsEl.appendChild(makeCaseSelect(function (v) {
				state.options.case = v;
				run();
			}));
		}
		if (feats.ascii85Delim) {
			optionsEl.appendChild(makeCheckbox('bcOptDelim', '包裹 <~ ~>', state.options.ascii85Delim, function (checked) {
				state.options.ascii85Delim = checked;
				run();
			}));
		}
	}

	function makeCheckbox(id, label, checked, onChange) {
		var lbl = document.createElement('label');
		lbl.className = 'bc-chk';
		lbl.htmlFor = id;
		var inp = document.createElement('input');
		inp.type = 'checkbox';
		inp.id = id;
		inp.checked = checked;
		inp.addEventListener('change', function () { onChange(inp.checked); });
		lbl.appendChild(inp);
		lbl.appendChild(document.createTextNode(label));
		return lbl;
	}

	function makeCaseSelect(onChange) {
		var lbl = document.createElement('label');
		lbl.className = 'bc-chk';
		lbl.appendChild(document.createTextNode('大小写'));
		var sel = document.createElement('select');
		var optU = document.createElement('option');
		optU.value = 'upper'; optU.textContent = '大写';
		var optL = document.createElement('option');
		optL.value = 'lower'; optL.textContent = '小写';
		sel.appendChild(optU);
		sel.appendChild(optL);
		sel.value = state.options.case;
		sel.addEventListener('change', function () { onChange(sel.value); });
		lbl.appendChild(sel);
		return lbl;
	}

	// === 主流程 ===
	function run() {
		var input = inputEl.value;
		bannerEl.hidden = true;
		errorEl.hidden = true;
		bannerListEl.innerHTML = '';

		if (!input) {
			outputEl.value = '';
			updateCounters();
			statusEl.textContent = '就绪';
			copyBtn.disabled = true;
			downloadBtn.disabled = true;
			return;
		}

		var algo = ALGOS[state.algo];
		var ctx = { warnings: [] };
		var outputBytes = null; // 解码模式下，输出是字节；编码模式下，输出是字符串

		try {
			if (state.mode === 'encode') {
				var bytes = strToBytes(input);
				var result = algo.encode(bytes, state.options);
				outputEl.value = result;
				outputBytes = strToBytes(result); // 用于下载
			} else {
				var decoded = algo.decode(input, ctx);
				outputBytes = decoded;
				var str;
				if (isValidUtf8(decoded)) {
					str = bytesToStr(decoded);
				} else {
					str = bytesToStr(decoded); // Latin-1 兜底显示
					ctx.warnings.push('解码结果不是有效 UTF-8 文本，已按 Latin-1 兜底显示。建议直接下载以保留原始字节');
				}
				outputEl.value = str;
			}
			statusEl.textContent = '完成';
			copyBtn.disabled = false;
			downloadBtn.disabled = false;
			if (ctx.warnings.length > 0) {
				bannerListEl.innerHTML = ctx.warnings.map(function (w) { return '<li>' + w + '</li>'; }).join('');
				bannerEl.hidden = false;
			}
		} catch (e) {
			outputEl.value = '';
			errorEl.textContent = e && e.message || String(e);
			errorEl.hidden = false;
			statusEl.textContent = '失败';
			copyBtn.disabled = true;
			downloadBtn.disabled = true;
		}
		updateCounters();
	}

	function updateCounters() {
		var inputVal = inputEl.value;
		var outputVal = outputEl.value;
		inputCounterEl.textContent = inputVal ? (inputVal.length + ' 字符 · ' + strToBytes(inputVal).length + ' 字节') : '';
		outputCounterEl.textContent = outputVal ? (outputVal.length + ' 字符 · ' + strToBytes(outputVal).length + ' 字节') : '';
	}

	// === 模式切换 ===
	function setMode(mode) {
		state.mode = mode;
		var btns = modeEl.querySelectorAll('.bc-seg');
		for (var i = 0; i < btns.length; i++) {
			var active = btns[i].dataset.mode === mode;
			btns[i].classList.toggle('active', active);
			btns[i].setAttribute('aria-selected', active ? 'true' : 'false');
		}
		// 输入框 placeholder / 标签随模式切换
		if (mode === 'encode') {
			inputLabelEl.textContent = '输入（待编码文本）';
			inputEl.placeholder = '在此输入待编码的文本…';
			outputEl.placeholder = '编码结果将在此显示…';
		} else {
			inputLabelEl.textContent = '输入（待解码字符串）';
			inputEl.placeholder = '在此输入待解码的字符串…';
			outputEl.placeholder = '解码结果将在此显示…';
		}
		renderOptions();
		run();
	}

	// === 复制 ===
	async function copyOutput() {
		var text = outputEl.value;
		if (!text) return;
		try {
			await navigator.clipboard.writeText(text);
		} catch (e) {
			var ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.top = '-9999px';
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand('copy'); } catch (e2) {}
			document.body.removeChild(ta);
		}
		var span = copyBtn.querySelector('span');
		var orig = span ? span.textContent : '';
		copyBtn.classList.add('copied');
		if (span) span.textContent = '已复制';
		setTimeout(function () {
			copyBtn.classList.remove('copied');
			if (span) span.textContent = orig || '复制';
		}, 1200);
	}

	// === 下载输出 ===
	function downloadOutput() {
		var text = outputEl.value;
		if (!text) return;
		var bytes = strToBytes(text);
		// 编码模式下，输出本身是 ASCII 文本，用 .txt；解码模式下，输出可能是二进制，用 .bin
		var ext = state.mode === 'decode' ? 'bin' : 'txt';
		var blob = new Blob([bytes], { type: 'application/octet-stream' });
		var url = URL.createObjectURL(blob);
		var a = document.createElement('a');
		a.href = url;
		a.download = 'base-codec-output.' + ext;
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
		setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
	}

	// === 交换：输出 → 输入，并切换到反向模式 ===
	function swap() {
		var out = outputEl.value;
		if (!out) return;
		inputEl.value = out;
		setMode(state.mode === 'encode' ? 'decode' : 'encode');
	}

	// === 示例 ===
	var SAMPLE = 'Hello, 世界！🌍';

	function fillSample() {
		inputEl.value = SAMPLE;
		setMode('encode');
		inputEl.focus();
	}

	// === 事件绑定 ===
	modeEl.addEventListener('click', function (e) {
		var btn = e.target.closest('.bc-seg');
		if (!btn) return;
		setMode(btn.dataset.mode);
	});
	algoEl.addEventListener('change', function () {
		state.algo = algoEl.value;
		renderOptions();
		run();
	});
	inputEl.addEventListener('input', run);
	$('bcBannerDismiss').addEventListener('click', function () { bannerEl.hidden = true; });
	copyBtn.addEventListener('click', copyOutput);
	downloadBtn.addEventListener('click', downloadOutput);
	swapBtn.addEventListener('click', swap);
	sampleBtn.addEventListener('click', fillSample);
	clearBtn.addEventListener('click', function () {
		inputEl.value = '';
		outputEl.value = '';
		bannerEl.hidden = true;
		errorEl.hidden = true;
		updateCounters();
		statusEl.textContent = '就绪';
		copyBtn.disabled = true;
		downloadBtn.disabled = true;
		inputEl.focus();
	});

	// === 初始化 ===
	renderOptions();
	run();
})();
</script>
