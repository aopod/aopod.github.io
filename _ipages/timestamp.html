		var o = {};
		f.formatToParts(new Date(epochMs)).forEach(function (p) { o[p.type] = p.value; });
		var hh = o.hour === '24' ? 0 : +o.hour; // 个别引擎午夜返回 '24'
		var asUTC = Date.UTC(+o.year, +o.month - 1, +o.day, hh, +o.minute, +o.second);
		return Math.round((asUTC - epochMs) / 60000);
	}

	// tz 下的各分量（字符串，已补零）
	function partsInTz(epochMs, tz) {
		var f = new Intl.DateTimeFormat('en-CA', {
			timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
			hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
		});
		var o = {};
		f.formatToParts(new Date(epochMs)).forEach(function (p) { o[p.type] = p.value; });
		var hh = o.hour === '24' ? '00' : o.hour;
		return { y: o.year, mo: o.month, d: o.day, h: hh, mi: o.minute, s: o.second };
	}

	// 「墙上时间」(按 tz 解释) → epoch 毫秒
	function wallTimeToEpochMs(y, mo, d, h, mi, s, tz) {
		var asIfUTC = Date.UTC(y, mo - 1, d, h, mi, s); // 把墙上时间当作 UTC
		return asIfUTC - tzOffsetMin(tz, asIfUTC) * 60000; // 减去 tz 偏移得到真实 epoch
	}

	// ISO 8601 带偏移：YYYY-MM-DDTHH:mm:ss±HH:MM
	function isoWithOffset(epochMs, tz) {
		var p = partsInTz(epochMs, tz);
		var off = tzOffsetMin(tz, epochMs);
		var sign = off < 0 ? '-' : '+';
		var ao = Math.abs(off);
		var oh = String(Math.floor(ao / 60)).padStart(2, '0');
		var om = String(ao % 60).padStart(2, '0');
		return p.y + '-' + p.mo + '-' + p.d + 'T' + p.h + ':' + p.mi + ':' + p.s + sign + oh + ':' + om;
	}

	// 完整可读时间（中文，按 tz）
	function fullZh(epochMs, tz) {
		return new Intl.DateTimeFormat('zh-CN', {
			timeZone: tz, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
			hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
		}).format(new Date(epochMs));
	}

	// 紧凑时间（用于顶部「当前」条）
	function timeShort(epochMs, tz) {
		return new Intl.DateTimeFormat('zh-CN', {
			timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
			hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
		}).format(new Date(epochMs));
	}

	// 相对时间
	function relative(epochMs, now) {
		var diff = epochMs - now;
		var past = diff < 0;
		var sec = Math.abs(diff) / 1000;
		var label;
		if (sec < 45) return '刚刚';
		else if (sec < 90) label = '1 分钟';
		else if (sec < 3600) label = Math.round(sec / 60) + ' 分钟';
		else if (sec < 7200) label = '1 小时';
		else if (sec < 86400) label = Math.round(sec / 3600) + ' 小时';
		else if (sec < 172800) label = '1 天';
		else if (sec < 2592000) label = Math.round(sec / 86400) + ' 天';
		else if (sec < 5184000) label = '1 个月';
		else if (sec < 31536000) label = Math.round(sec / 2592000) + ' 个月';
		else { var yr = sec / 31536000; label = yr < 2 ? '1 年' : Math.round(yr) + ' 年'; }
		return past ? label + '前' : label + '后';
	}

	// 星期（中文）+ 当年第几天
	function weekdayAndDoy(epochMs, tz) {
		var wd = new Intl.DateTimeFormat('zh-CN', { timeZone: tz, weekday: 'long' }).format(new Date(epochMs));
		var p = partsInTz(epochMs, tz);
		var start = Date.UTC(+p.y, 0, 1);
		var cur = Date.UTC(+p.y, +p.mo - 1, +p.d);
		var doy = Math.floor((cur - start) / 86400000) + 1;
		return wd + ' · 当年第 ' + doy + ' 天';
	}

	// === 解析：时间戳 ===
	function parseTs(raw) {
		var s = raw.trim();
		if (!s) return null;
		if (!/^[+-]?\d+(\.\d+)?$/.test(s)) {
			throw new Error('时间戳应为纯数字（可选负号 / 小数）');
		}
		var n = Number(s);
		if (!isFinite(n)) throw new Error('数值无效');
		var unit = state.unit; // 's' 或 'ms'，不再自动判定
		var ms = unit === 's' ? n * 1000 : n;
		if (Math.abs(ms) > 8.64e15) throw new Error('时间戳超出可表示范围（约 ±2.7 亿年）');
		var d = new Date(ms);
		if (isNaN(d.getTime())) throw new Error('无法解析该时间戳');
		return { ms: ms, unit: unit, unsafe: Math.abs(n) > Number.MAX_SAFE_INTEGER };
	}

	// === 解析：日期时间串 ===
	function parseDate(raw, tz) {
		var s = raw.trim();
		if (!s) return null;
		var ms;
		// 1) 带显式偏移 / Z 的串 → 绝对时间
		if (/(?:[Zz]|[+-]\d{2}:?\d{2})\s*$/.test(s)) {
			var dAbs = new Date(s);
			if (!isNaN(dAbs.getTime())) ms = dAbs.getTime();
		}
		// 2) naive 串 → 按所选时区解释墙上时间
		if (ms === undefined) {
			var m = s.match(/^(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})(?:[日\sT]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
			if (m) {
				var y = +m[1], mo = +m[2], dd = +m[3];
				var h = m[4] ? +m[4] : 0, mi = m[5] ? +m[5] : 0, se = m[6] ? +m[6] : 0;
				if (mo >= 1 && mo <= 12 && dd >= 1 && dd <= 31 && h <= 23 && mi <= 59 && se <= 59) {
					var cand = wallTimeToEpochMs(y, mo, dd, h, mi, se, tz);
					if (!isNaN(new Date(cand).getTime())) ms = cand;
				}
			}
		}
		if (ms === undefined) throw new Error('无法识别的时间格式，试试 2024-01-15 10:30:45 或 ISO 串');
		return ms;
	}

	// === 结果面板渲染 ===
	function clearResults() {
		liveRow = null;
		resultsEl.innerHTML = '<div class="ts-empty">结果将在此显示…</div>';
	}

	function renderResults(rows) {
		liveRow = null;
		resultsEl.innerHTML = '';
		rows.forEach(function (r) {
			var row = document.createElement('div');
			row.className = 'ts-row';

			var lab = document.createElement('span');
			lab.className = 'ts-row-label';
			lab.textContent = r.label;

			var val = document.createElement('code');
			val.className = 'ts-row-val';
			val.textContent = r.value;

			var btn = document.createElement('button');
			btn.className = 'ts-copy-mini';
			btn.type = 'button';
			btn.title = '复制';
			btn.setAttribute('aria-label', '复制 ' + r.label);
			btn.innerHTML = COPY_SVG;
			btn.addEventListener('click', function () { copyText(r.value, btn); });

			row.appendChild(lab);
			row.appendChild(val);
			row.appendChild(btn);
			resultsEl.appendChild(row);

			if (r.live) liveRow = { el: val, ms: r.ms };
		});
	}

	function showBanner(msgs) {
		bannerListEl.innerHTML = msgs.map(function (w) { return '<li>' + w + '</li>'; }).join('');
		bannerEl.hidden = false;
	}

	// === 主流程 ===
	function run() {
		bannerEl.hidden = true;
		errorEl.hidden = true;
		bannerListEl.innerHTML = '';

		if (state.mode === 'ts2date') {
			var raw = tsInputEl.value;
			if (!raw.trim()) {
				clearResults();
				unitBadgeEl.hidden = true;
				inputCounterEl.textContent = '';
				statusEl.textContent = '就绪';
				return;
			}
			try {
				var r = parseTs(raw);
				unitBadgeEl.hidden = false;
				unitBadgeEl.textContent = r.unit === 's' ? '秒' : '毫秒';
				unitBadgeEl.className = 'ts-badge' + (r.unit === 'ms' ? ' ms' : '');
				inputCounterEl.textContent = '= ' + Math.trunc(r.ms) + ' ms';
				renderResults([
					{ label: '完整时间', value: fullZh(r.ms, effTz()) },
					{ label: 'ISO 8601', value: isoWithOffset(r.ms, effTz()) },
					{ label: 'UTC', value: new Date(r.ms).toISOString() },
					{ label: 'RFC 1123', value: new Date(r.ms).toUTCString() },
					{ label: '相对时间', value: relative(r.ms, Date.now()), live: true, ms: r.ms },
					{ label: '星期 · 第几天', value: weekdayAndDoy(r.ms, effTz()) }
				]);
				statusEl.textContent = '完成';
				if (r.unsafe) showBanner(['数值超出安全整数范围（2<sup>53</sup>-1），结果可能存在精度损失']);
			} catch (e) {
				clearResults();
				unitBadgeEl.hidden = true;
				inputCounterEl.textContent = '';
				errorEl.textContent = e && e.message || String(e);
				errorEl.hidden = false;
				statusEl.textContent = '失败';
			}
		} else {
			var raw2 = dateInputEl.value;
			if (!raw2.trim()) {
				clearResults();
				statusEl.textContent = '就绪';
				return;
			}
			try {
				var ms2 = parseDate(raw2, effTz());
				renderResults([
					{ label: 'Unix 秒', value: String(Math.trunc(ms2 / 1000)) },
					{ label: 'Unix 毫秒', value: String(Math.trunc(ms2)) },
					{ label: 'ISO 8601', value: isoWithOffset(ms2, effTz()) },
					{ label: 'UTC', value: new Date(ms2).toISOString() },
					{ label: '完整时间', value: fullZh(ms2, effTz()) }
				]);
				statusEl.textContent = '完成';
			} catch (e) {
				clearResults();
				errorEl.textContent = e && e.message || String(e);
				errorEl.hidden = false;
				statusEl.textContent = '失败';
			}
		}
	}

	// === 模式切换 ===
	function setMode(mode) {
		state.mode = mode;
		var btns = modeEl.querySelectorAll('.ts-seg');
		for (var i = 0; i < btns.length; i++) {
			var active = btns[i].dataset.mode === mode;
			btns[i].classList.toggle('active', active);
			btns[i].setAttribute('aria-selected', active ? 'true' : 'false');
		}
		var isTs = mode === 'ts2date';
		tsRowEl.hidden = !isTs;
		dateRowEl.hidden = isTs;
		tsHintEl.hidden = !isTs;
		dateHintEl.hidden = isTs;
		unitEl.hidden = !isTs; // 单位分段仅时间戳方向可见
		alignBtn.hidden = !isTs || state.unit !== 'ms'; // 「对齐到秒」仅在时间戳·毫秒下出现
		if (isTs) {
			inputLabelEl.textContent = '时间戳';
			tsInputEl.placeholder = '如 1705272645（秒）或 1705272645000（毫秒）';
		} else {
			inputLabelEl.textContent = '日期时间';
			dateInputEl.placeholder = '如 2024-01-15 10:30:45 或 ISO 串';
		}
		run();
	}

	// === 单位切换 ===
	function setUnit(unit) {
		state.unit = unit;
		var btns = unitEl.querySelectorAll('.ts-seg');
		for (var i = 0; i < btns.length; i++) {
			btns[i].classList.toggle('active', btns[i].dataset.unit === unit);
		}
		alignBtn.hidden = state.mode !== 'ts2date' || unit !== 'ms';
		tick(); // 切换单位后立即刷新顶部「当前」条
		run();
	}

	// === 复制（带 execCommand 兜底 + 绿色反馈） ===
	function doCopy(text) {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			return navigator.clipboard.writeText(text);
		}
		return new Promise(function (resolve) {
			var ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.top = '-9999px';
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand('copy'); } catch (e) {}
			document.body.removeChild(ta);
			resolve();
		});
	}

	function copyText(text, btn) {
		if (!text) return;
		var orig = btn.innerHTML;
		doCopy(text).then(function () {
			btn.classList.add('copied');
			btn.innerHTML = CHECK_SVG;
			btn.title = '已复制';
			setTimeout(function () {
				btn.classList.remove('copied');
				btn.innerHTML = orig;
				btn.title = '复制';
			}, 1200);
		});
	}

	// === 顶部「当前」实时条 ===
	// 按所选单位渲染时间戳串：秒 / 毫秒；「自动」按秒显示
	function nowTsStr(now) {
		return state.unit === 'ms' ? String(Math.trunc(now)) : String(Math.trunc(now / 1000));
	}

	function tick() {
		var now = Date.now();
		nowTsEl.textContent = nowTsStr(now);
		nowTzEl.textContent = timeShort(now, effTz());
		if (liveRow) liveRow.el.textContent = relative(liveRow.ms, now);
	}

	function fillNow() {
		if (state.mode === 'ts2date') {
			tsInputEl.value = nowTsStr(Date.now());
		} else {
			var p = partsInTz(Date.now(), effTz());
			dateInputEl.value = p.y + '-' + p.mo + '-' + p.d + ' ' + p.h + ':' + p.mi + ':' + p.s;
		}
		run();
		focusInput();
	}

	function fillSample() {
		if (state.mode === 'ts2date') {
			tsInputEl.value = state.unit === 'ms' ? '1705272645000' : '1705272645';
		} else {
			dateInputEl.value = '2024-01-15 10:30:00';
		}
		run();
		focusInput();
	}

	// 毫秒模式下：把输入抹零到整秒（末三位 → 000）
	function alignToSecond() {
		var raw = tsInputEl.value.trim();
		if (!raw) return;
		if (!/^[+-]?\d+(\.\d+)?$/.test(raw)) return;
		var n = Number(raw);
		var aligned = Math.trunc(n / 1000) * 1000;
		tsInputEl.value = String(aligned);
		run();
	}

	function focusInput() {
		(state.mode === 'ts2date' ? tsInputEl : dateInputEl).focus();
	}

	// === 事件绑定 ===
	modeEl.addEventListener('click', function (e) {
		var btn = e.target.closest('.ts-seg');
		if (btn) setMode(btn.dataset.mode);
	});
	unitEl.addEventListener('click', function (e) {
		var btn = e.target.closest('.ts-seg');
		if (btn) setUnit(btn.dataset.unit);
	});
	tzEl.addEventListener('change', function () {
		state.tz = tzEl.value;
		run();
		tick();
	});
	tsInputEl.addEventListener('input', run);
	dateInputEl.addEventListener('input', run);
	pickerEl.addEventListener('change', function () {
		if (pickerEl.value) {
			// datetime-local 的值形如 YYYY-MM-DDTHH:mm:ss，按所选时区解释
			dateInputEl.value = pickerEl.value.replace('T', ' ');
			run();
		}
	});
	nowUseBtn.addEventListener('click', fillNow);
	sampleBtn.addEventListener('click', fillSample);
	alignBtn.addEventListener('click', alignToSecond);
	$('tsBannerDismiss').addEventListener('click', function () { bannerEl.hidden = true; });
	clearBtn.addEventListener('click', function () {
		tsInputEl.value = '';
		dateInputEl.value = '';
		pickerEl.value = '';
		clearResults();
		unitBadgeEl.hidden = true;
		inputCounterEl.textContent = '';
		bannerEl.hidden = true;
		errorEl.hidden = true;
		statusEl.textContent = '就绪';
		focusInput();
	});

	// === 初始化 ===
	tzLocalEl.textContent = '本地 · ' + LOCAL_TZ;
	// 深链：#date2ts 切到反向模式；?ts= 或 ?dt= 预填输入（便于分享一次转换）
	try {
		var params = new URLSearchParams(location.search);
		if (location.hash.indexOf('date2ts') > -1) setMode('date2ts');
		var tsQ = params.get('ts');
		var dtQ = params.get('dt');
		if (state.mode === 'ts2date' && tsQ) tsInputEl.value = tsQ;
		if (state.mode === 'date2ts' && dtQ) dateInputEl.value = dtQ;
	} catch (e) {}
	tick();
	setInterval(tick, 1000);
	run();
})();
</script>
