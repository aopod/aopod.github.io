<h2>二维码生成</h2>
<div id="qr_area">
	<div id="qr_display">
		
	</div>
	<div id="qr_input">
		<textarea placeholder="{{site.url}}"></textarea>
		<div id="qr_message" role="status" aria-live="polite" hidden></div>
	</div>
</div>
<script type="text/javascript" src="{{ "/js/qrcode-generator.js" | prepend: site.asset_path }}"></script>
<script type='text/javascript'>
(function () {
	const displayElement = document.querySelector('#qr_display');
	const inputElement = document.querySelector('#qr_input > textarea');
	const messageElement = document.querySelector('#qr_message');

	// QR Code 40 版、8-bit byte mode 在各容错等级下的最大容量。
	const MAX_CAPACITIES = {
		L: 2953,
		M: 2331,
		Q: 1663,
		H: 1273
	};
	const CORRECT_LEVELS = ['H', 'Q', 'M', 'L'];

	function showMessage(message, isError) {
		messageElement.textContent = message;
		messageElement.className = isError ? 'qr_error' : 'qr_info';
		messageElement.hidden = false;
	}

	// 用 U+FFFD 替换无效的孤立代理项，避免粘贴的异常 Unicode 导致编码器报错。
	function toWellFormed(text) {
		if (typeof text.toWellFormed === 'function') {
			return text.toWellFormed();
		}

		let result = '';
		for (let i = 0; i < text.length; i += 1) {
			const code = text.charCodeAt(i);
			if (code >= 0xD800 && code <= 0xDBFF) {
				const next = text.charCodeAt(i + 1);
				if (next >= 0xDC00 && next <= 0xDFFF) {
					result += text[i] + text[i + 1];
					i += 1;
				} else {
					result += '\uFFFD';
				}
			} else if (code >= 0xDC00 && code <= 0xDFFF) {
				result += '\uFFFD';
			} else {
				result += text[i];
			}
		}
		return result;
	}

	function updateQRCode(text) {
		displayElement.innerHTML = '';

		if (text == null || text.length === 0) {
			text = '{{site.url}}';
		}
		text = toWellFormed(text);

		if (typeof qrcode === 'undefined') {
			showMessage('二维码组件加载失败，请刷新页面后重试。', true);
			return;
		}

		const byteSize = new Blob([text]).size;
		if (byteSize > MAX_CAPACITIES.L) {
			showMessage(`内容经 UTF-8 编码后为 ${byteSize} 字节，超过单个二维码 ${MAX_CAPACITIES.L} 字节的最大容量。请缩短内容后重试（中文通常占 3 字节，emoji 通常占 4 字节）。`, true);
			return;
		}

		let lastError = null;
		for (const levelStr of CORRECT_LEVELS) {
			if (byteSize > MAX_CAPACITIES[levelStr]) continue;

			try {
				const qr = qrcode(0, levelStr);
				qr.addData(text, 'Byte');
				qr.make();
				displayElement.innerHTML = qr.createSvgTag({
					cellSize: 4,
					margin: 16,
					scalable: true,
					title: '生成的二维码'
				});
				showMessage(`已生成 · UTF-8 ${byteSize} 字节 · ${levelStr} 级容错`, false);
				return;
			} catch (error) {
				lastError = error;
			}
		}

		console.error('QR code generation failed:', lastError);
		showMessage(`无法生成二维码。内容经 UTF-8 编码后为 ${byteSize} 字节，请缩短内容或移除部分复杂字符后重试。`, true);
	}

	let timeoutToken = null;
	inputElement.addEventListener('input', () => {
		if (timeoutToken != null) {
			window.clearTimeout(timeoutToken);
			timeoutToken = null;
		}
		timeoutToken = window.setTimeout(() => {
			let text = inputElement.value;
			updateQRCode(text);
		}, 500);
	});

	updateQRCode();
})();
</script>
