<script type="text/javascript">
(function () {
	'use strict';

	var root = document.getElementById('lunisolar-calendar');
	var app = document.getElementById('lc-app');
	var unsupported = document.getElementById('lc-unsupported');
	var today = startOfDay(new Date());
	var minYear = today.getFullYear() - 100;
	var maxYear = today.getFullYear() + 100;
	var minDate = makeDate(minYear, 0, 1);
	var maxDate = makeDate(maxYear, 11, 31);
	var selected = today;
	var viewYear = today.getFullYear();
	var viewMonth = today.getMonth();
	var lunarFormatter;
	var lunarCache = new Map();
	var lunarYearCache = new Map();

	var monthNames = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
	var monthNumbers = {
		'正月': 1, '一月': 1, '二月': 2, '三月': 3, '四月': 4, '五月': 5, '六月': 6,
		'七月': 7, '八月': 8, '九月': 9, '十月': 10, '冬月': 11, '十一月': 11,
		'腊月': 12, '十二月': 12
	};
	var dayNames = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
		'十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
		'廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
	var zodiac = ['猴', '鸡', '狗', '猪', '鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊'];
	var solarFestivals = {
		'1-1': '元旦', '2-14': '情人节', '3-8': '妇女节', '3-12': '植树节', '5-1': '劳动节',
		'5-4': '青年节', '6-1': '儿童节', '9-10': '教师节', '10-1': '国庆节', '12-25': '圣诞节'
	};
	var lunarFestivals = {
		'1-1': '春节', '1-15': '元宵节', '2-2': '龙抬头', '5-5': '端午节',
		'7-7': '七夕', '7-15': '中元节', '8-15': '中秋节', '9-9': '重阳节', '12-8': '腊八节', '12-23': '北方小年', '12-24': '南方小年'
	};

	try {
		lunarFormatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
			year: 'numeric', month: 'long', day: 'numeric'
		});
		var probe = lunarFormatter.formatToParts(makeDate(2024, 1, 10));
		if (!partValue(probe, 'relatedYear') || !partValue(probe, 'month')) throw new Error('unsupported');
	} catch (error) {
		unsupported.hidden = false;
		return;
	}

	app.hidden = false;
	document.getElementById('lc-range').textContent = '可查询 ' + minYear + '—' + maxYear + ' 年';
	fillSolarSelectors();
	fillLunarYears();
	bindEvents();
	render();
	syncLunarInputs(selected);

	function makeDate(year, month, day) {
		var date = new Date(0);
		date.setHours(12, 0, 0, 0);
		date.setFullYear(year, month, day);
		return date;
	}

	function startOfDay(date) { return makeDate(date.getFullYear(), date.getMonth(), date.getDate()); }
	function dateKey(date) {
		return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
	}
	function pad(value) { return String(value).padStart(2, '0'); }
	function sameDate(a, b) { return dateKey(a) === dateKey(b); }
	function addDays(date, amount) {
		var next = makeDate(date.getFullYear(), date.getMonth(), date.getDate());
		next.setDate(next.getDate() + amount);
		return next;
	}
	function clampDate(date) { return date < minDate ? minDate : (date > maxDate ? maxDate : date); }
	function partValue(parts, type) {
		var item = parts.find(function (part) { return part.type === type; });
		return item ? item.value : '';
	}

	function lunarInfo(date) {
		var key = dateKey(date);
		if (lunarCache.has(key)) return lunarCache.get(key);
		var parts = lunarFormatter.formatToParts(date);
		var rawMonth = partValue(parts, 'month');
		var leap = rawMonth.indexOf('闰') === 0;
		var cleanMonth = rawMonth.replace('闰', '');
		var month = monthNumbers[cleanMonth];
		if (!month) throw new Error('无法识别农历月份：' + rawMonth);
		var info = {
			year: Number(partValue(parts, 'relatedYear')),
			yearName: partValue(parts, 'yearName'),
			month: month,
			monthName: cleanMonth,
			rawMonth: rawMonth,
			day: Number(partValue(parts, 'day')),
			leap: leap
		};
		lunarCache.set(key, info);
		return info;
	}

	function festivals(date, lunar) {
		var result = [];
		var solar = solarFestivals[(date.getMonth() + 1) + '-' + date.getDate()];
		if (solar) result.push(solar);
		if (!lunar.leap) {
			var lunarFestival = lunarFestivals[lunar.month + '-' + lunar.day];
			if (lunarFestival) result.push(lunarFestival);
		}
		var next = lunarInfo(addDays(date, 1));
		if (lunar.month === 12 && next.month === 1 && next.day === 1) result.push('除夕');
		return result;
	}

	function fillSolarSelectors() {
		var yearSelect = document.getElementById('lc-year');
		for (var y = minYear; y <= maxYear; y += 1) yearSelect.add(new Option(y + '年', y));
		var monthSelect = document.getElementById('lc-month');
		for (var m = 1; m <= 12; m += 1) monthSelect.add(new Option(m + '月', m - 1));
	}

	function fillLunarYears() {
		var select = document.getElementById('lc-lunar-year');
		// 公历范围起始年的一、二月通常仍属于上一个农历年。
		for (var y = minYear - 1; y <= maxYear; y += 1) select.add(new Option(y + '年', y));
	}

	function render() {
		document.getElementById('lc-year').value = viewYear;
		document.getElementById('lc-month').value = viewMonth;
		var days = document.getElementById('lc-days');
		days.innerHTML = '';
		var first = makeDate(viewYear, viewMonth, 1);
		var cursor = addDays(first, -first.getDay());
		for (var i = 0; i < 42; i += 1) {
			var date = addDays(cursor, i);
			var lunar = lunarInfo(date);
			var labels = festivals(date, lunar);
			var button = document.createElement('button');
			button.type = 'button';
			button.className = 'lc-day';
			button.setAttribute('role', 'gridcell');
			button.dataset.date = dateKey(date);
			if (date < minDate || date > maxDate) {
				button.disabled = true;
				button.removeAttribute('data-date');
			}
			if (date.getMonth() !== viewMonth) button.classList.add('is-outside');
			if (sameDate(date, today)) button.classList.add('is-today');
			if (sameDate(date, selected)) button.classList.add('is-selected');
			var lunarLabel = labels[0] || (lunar.day === 1 ? lunar.rawMonth : dayNames[lunar.day - 1]);
			button.innerHTML = '<span class="lc-day-solar">' + date.getDate() + '</span>' +
				'<span class="lc-day-lunar' + (labels.length ? ' is-festival' : '') + '">' + lunarLabel + '</span>';
			button.setAttribute('aria-label', date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日，农历' + lunar.rawMonth + dayNames[lunar.day - 1] + (labels.length ? '，' + labels.join('、') : ''));
			days.appendChild(button);
		}
		renderDetail();
		setNavState();
	}

	function renderDetail() {
		var lunar = lunarInfo(selected);
		var labels = festivals(selected, lunar);
		var weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
		document.getElementById('lc-detail-date').textContent = pad(selected.getMonth() + 1) + '月' + pad(selected.getDate()) + '日';
		document.getElementById('lc-detail-week').textContent = weekdays[selected.getDay()];
		document.getElementById('lc-detail-lunar').textContent = '农历 ' + lunar.rawMonth + dayNames[lunar.day - 1];
		document.getElementById('lc-detail-meta').textContent = selected.getFullYear() + '年 · ' + (lunar.yearName || '') + zodiac[lunar.year % 12] + '年';
		var tags = document.getElementById('lc-tags');
		tags.innerHTML = '';
		labels.forEach(function (label) {
			var span = document.createElement('span');
			span.className = 'lc-tag';
			span.textContent = label;
			tags.appendChild(span);
		});
	}

	function setNavState() {
		document.getElementById('lc-prev').disabled = viewYear === minYear && viewMonth === 0;
		document.getElementById('lc-next').disabled = viewYear === maxYear && viewMonth === 11;
	}

	function moveMonth(amount) {
		var target = makeDate(viewYear, viewMonth + amount, 1);
		if (target < minDate || target > maxDate) return;
		viewYear = target.getFullYear();
		viewMonth = target.getMonth();
		render();
	}

	function selectDate(date, syncInputs) {
		selected = clampDate(date);
		viewYear = selected.getFullYear();
		viewMonth = selected.getMonth();
		render();
		if (syncInputs !== false) syncLunarInputs(selected);
	}

	function lunarMonthsForYear(year) {
		if (lunarYearCache.has(year)) return lunarYearCache.get(year);
		var found = [];
		var seen = {};
		var cursor = makeDate(year, 0, 1);
		var end = makeDate(year + 1, 2, 15);
		while (cursor <= end) {
			var info = lunarInfo(cursor);
			if (info.year === year) {
				var key = info.month + (info.leap ? '-leap' : '');
				if (!seen[key]) {
					seen[key] = true;
					found.push({ month: info.month, leap: info.leap, label: info.rawMonth });
				}
			}
			cursor = addDays(cursor, 1);
		}
		lunarYearCache.set(year, found);
		return found;
	}

	function updateLunarMonths(preferredMonth, preferredLeap) {
		var year = Number(document.getElementById('lc-lunar-year').value);
		var select = document.getElementById('lc-lunar-month');
		select.innerHTML = '';
		lunarMonthsForYear(year).forEach(function (item) {
			var value = item.month + (item.leap ? '-leap' : '');
			select.add(new Option(item.label, value));
		});
		var preferred = preferredMonth + (preferredLeap ? '-leap' : '');
		if (preferredMonth && Array.from(select.options).some(function (option) { return option.value === preferred; })) select.value = preferred;
		updateLunarDays();
	}

	function updateLunarDays(preferredDay) {
		var year = Number(document.getElementById('lc-lunar-year').value);
		var monthValue = document.getElementById('lc-lunar-month').value;
		var bits = monthValue.split('-');
		var month = Number(bits[0]);
		var leap = bits[1] === 'leap';
		var length = lunarMonthLength(year, month, leap);
		var select = document.getElementById('lc-lunar-day');
		select.innerHTML = '';
		for (var d = 1; d <= length; d += 1) select.add(new Option(dayNames[d - 1], d));
		if (preferredDay && preferredDay <= length) select.value = preferredDay;
	}

	function lunarMonthLength(year, month, leap) {
		var date = findLunarDate(year, month, 1, leap);
		if (!date) return 29;
		var count = 1;
		while (count < 30) {
			var info = lunarInfo(addDays(date, count));
			if (info.year !== year || info.month !== month || info.leap !== leap) break;
			count += 1;
		}
		return count;
	}

	function findLunarDate(year, month, day, leap) {
		var cursor = makeDate(year, 0, 1);
		var end = makeDate(year + 1, 2, 15);
		while (cursor <= end) {
			var info = lunarInfo(cursor);
			if (info.year === year && info.month === month && info.day === day && info.leap === leap) return cursor;
			cursor = addDays(cursor, 1);
		}
		return null;
	}

	function syncLunarInputs(date) {
		var lunar = lunarInfo(date);
		document.getElementById('lc-lunar-year').value = lunar.year;
		updateLunarMonths(lunar.month, lunar.leap);
		updateLunarDays(lunar.day);
	}

	function bindEvents() {
		document.getElementById('lc-prev').addEventListener('click', function () { moveMonth(-1); });
		document.getElementById('lc-next').addEventListener('click', function () { moveMonth(1); });
		document.getElementById('lc-today').addEventListener('click', function () { selectDate(today); });
		document.getElementById('lc-year').addEventListener('change', function (event) {
			viewYear = Number(event.target.value); render();
		});
		document.getElementById('lc-month').addEventListener('change', function (event) {
			viewMonth = Number(event.target.value); render();
		});
		document.getElementById('lc-days').addEventListener('click', function (event) {
			var button = event.target.closest('.lc-day');
			if (!button) return;
			var parts = button.dataset.date.split('-').map(Number);
			selectDate(makeDate(parts[0], parts[1] - 1, parts[2]));
		});
		document.getElementById('lc-lunar-year').addEventListener('change', function () { updateLunarMonths(); });
		document.getElementById('lc-lunar-month').addEventListener('change', function () { updateLunarDays(); });
		document.getElementById('lc-jump').addEventListener('click', function () {
			var year = Number(document.getElementById('lc-lunar-year').value);
			var bits = document.getElementById('lc-lunar-month').value.split('-');
			var day = Number(document.getElementById('lc-lunar-day').value);
			var match = findLunarDate(year, Number(bits[0]), day, bits[1] === 'leap');
			var message = document.getElementById('lc-message');
			if (!match || match < minDate || match > maxDate) {
				message.className = 'lc-message is-error';
				message.textContent = '没有在可查询范围内找到这个农历日期。';
				return;
			}
			message.className = 'lc-message';
			message.textContent = '对应公历：' + match.getFullYear() + '年' + (match.getMonth() + 1) + '月' + match.getDate() + '日';
			selectDate(match, false);
		});
		root.addEventListener('keydown', function (event) {
			if (event.target.matches('select, button') && !event.target.classList.contains('lc-day')) return;
			var amount = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key];
			if (!amount) return;
			event.preventDefault();
			selectDate(addDays(selected, amount));
			var selectedButton = document.querySelector('.lc-day.is-selected');
			if (selectedButton) selectedButton.focus();
		});
	}
})();
</script>
